name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Validate & Lint (${{ matrix.solution }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        solution: [root, external_tenant, verified_id]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # Overlays the final solution from doc/result/** and runs
      # init -> fmt -check -> validate -> tflint. Same script runs locally:
      #   wsl -e bash scripts/ci/validate.sh
      - name: Validate & Lint (final solution)
        env:
          IN_PLACE: "1"
        run: bash scripts/ci/validate.sh ${{ matrix.solution }}
